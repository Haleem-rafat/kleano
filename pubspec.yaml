name: thewasher
description: A new Flutter project.

publish_to: "none"

version: 3.0.0+10

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter_localizations:
    sdk: flutter
  animated_custom_dropdown: ^4.0.0
  animations: ^2.2.0
  avatar_glow: ^3.0.1
  badges: ^4.0.1
  appsflyer_sdk: ^7.0.4
  cached_network_image: ^4.0.6
  control_style: ^0.1.0
  dartz: ^0.10.1
  dio: ^5.9.0
  dotted_border: ^3.1.0
  dotted_line: ^3.1.0
  jwt_decoder: ^2.0.1
  equatable: ^3.0.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  fl_country_code_picker: ^0.1.9+1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_countdown_timer: ^4.1.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_phone_direct_caller: ^2.1.1
  flutter_polyline_points: ^3.1.0
  flutter_rating_bar: ^4.0.1
  flutter_screenutil: ^5.9.0
  intl: ^0.20.3
  flutter_slidable: ^4.0.3
  flutter_svg: ^2.3.2
  flutter_translate:
    path: third_party/flutter_translate
  geocoding: ^5.0.1
  geolocator: ^14.0.2
  get_it: ^9.3.0
  google_maps_flutter: ^2.13.1
  image_picker: ^1.1.2
  chucker_flutter: ^1.8.5
  lottie: ^3.0.0
  percent_indicator: ^4.2.3
  phone_numbers_parser: ^9.0.28
  photo_view: ^0.15.0
  pin_code_fields: ^9.5.1
  pull_to_refresh: ^2.0.0
  shimmer_animation: ^2.1.0+1
  sliding_up_panel: ^2.0.0+1
  socket_io_client: ^3.1.6
  shared_preferences: ^2.0.15
  table_calendar: ^3.1.3
  easy_date_timeline: ^2.0.9
  url_launcher: ^6.3.1
  moyasar: ^3.0.6

  font_awesome_flutter: ^11.0.0
  webview_flutter: ^4.13.0

  bloc: any
  http: any
  meta: any
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_flavorizr: ^2.6.0

flavorizr:
  app:
    android:
      flavorDimensions: "flavor-type"
    ios:

  flavors:
    pro:
      app:
        name: "KleanO"
      android:
        applicationId: "co.Kleano"
        firebase:
          config: "android/app/src/pro/google-services.json"
      ios:
        bundleId: "co.spiritude.kleano"

    dev:
      app:
        name: "KleanO Dev"
      android:
        applicationId: "co.Kleano.dev"
        firebase:
          config: "android/app/src/dev/google-services.json"
      ios:
        bundleId: "co.spiritude.kleanoDev"

flutter:
  uses-material-design: true

  assets:
    - assets/i18n/
    - assets/images/
    - assets/images/2.0x/
    - assets/images/3.0x/
    - assets/svg/
    - assets/svg/carType/
    - assets/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: ScriptMT
      fonts:
        - asset: assets/fonts/ScriptMTBold.ttf
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont_slnt,wght.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/appicon1.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/appicon1.jpg"
  min_sdk_android: 21
  remove_alpha_ios: true
  android_12:
    image_path: "assets/images/appicon1.jpg"
    icon_background_color: "#FFFFFF"
    adaptive_icon_background: "#FFFFFF"
    adaptive_icon_foreground: "assets/images/appicon1.jpg"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

