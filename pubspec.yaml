name: thewasher
description: A new Flutter project.

publish_to: "none"

version: 3.0.0+10

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter_localizations:
    sdk: flutter
  animated_custom_dropdown: ^3.1.1
  animations: ^2.0.2
  avatar_glow:
  badges: ^3.0.2
  appsflyer_sdk: ^6.17.5
  cached_network_image: ^3.2.2
  carousel_slider: ^4.1.1
  control_style: ^0.1.0
  cupertino_icons: ^1.0.2
  custom_marker: ^1.0.0
  dartz: ^0.10.1
  dio: ^5.9.0
  dotted_border: ^2.0.0+2
  dotted_line: ^3.1.0
  jwt_decoder: ^2.0.1
  equatable: ^2.0.5
  firebase_core: ^3.2.0
  firebase_core_platform_interface: ^5.1.0
  firebase_messaging: ^15.0.3
  fl_country_code_picker: ^0.1.9+1
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.1
  flutter_countdown_timer: ^4.1.0
  flutter_flavorizr: ^2.1.4
  flutter_local_notifications: ^17.2.1+1
  timezone: ^0.9.4
  flutter_phone_direct_caller: ^2.1.1
  flutter_polyline_points: ^2.1.0
  flutter_rating_bar: ^4.0.1
  flutter_screenutil: ^5.9.0
  intl: ^0.20.3
  flutter_slidable: ^3.1.0
  flutter_svg: ^1.1.5
  flutter_translate: ^4.0.3
  geocoding: ^3.0.0
  geolocator: ^12.0.0
  get_it: ^7.2.0
  google_fonts: ^4.0.4
  google_maps_flutter: ^2.13.1
  image_picker: ^1.1.2
  chucker_flutter: ^1.8.5
  lottie: ^3.0.0
  percent_indicator: ^4.2.3
  phone_numbers_parser: ^8.3.0
  photo_view: ^0.15.0
  pin_code_fields: ^8.0.1
  pull_to_refresh: ^2.0.0
  shimmer_animation: ^2.1.0+1
  sliding_up_panel: ^2.0.0+1
  socket_io_client: ^2.0.1
  shared_preferences: ^2.0.15
  smooth_page_indicator: ^1.2.0+3
  table_calendar:
  easy_date_timeline: ^1.1.3
  url_launcher: ^6.3.1
  moyasar: ^2.0.19
  # package_info_plus: ^4.2.0

  font_awesome_flutter: ^11.0.0
  webview_flutter: any

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flavorizr:
  app:
    android:
      flavorDimensions: "flavor-type"
    ios:

  flavors:
  pro:
    app:
      name: "KleanO"
    android:
      applicationId: "co.spiritude.thewasher"
      firebase:
        config: "android/app/src/pro/google-services.json"
    ios:
      bundleId: "co.spiritude.thewasher"

  dev:
    app:
      name: "KleanO Dev"
    android:
      applicationId: "co.spiritude.thewasher.dev"
      firebase:
        config: "android/app/src/dev/google-services.json"
    ios:
      bundleId: "co.spiritude.thewasher.dev"

flutter:
  uses-material-design: true

  assets:
    - assets/i18n/
    - assets/images/
    - assets/images/2.0x/
    - assets/images/3.0x/
    - assets/svg/
    - assets/svg/carType/
    - assets/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets\fonts\Roboto-Regular.ttf
        - asset: assets\fonts\Roboto-Bold.ttf
    - family: ScriptMT
      fonts:
        - asset: assets\fonts\ScriptMTBold.ttf
    - family: Cairo
      fonts:
        - asset: assets\fonts\Cairo-VariableFont_slnt,wght.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/appicon1.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/appicon1.jpg"
  min_sdk_android: 21
  remove_alpha_ios: true
  android_12:
    image_path: "assets/images/appicon1.jpg"
    icon_background_color: "#FFFFFF"
    adaptive_icon_background: "#FFFFFF"
    adaptive_icon_foreground: "assets/images/appicon1.jpg"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

dependency_overrides:
  intl: ^0.20.3
  flutter_translate:
    path: third_party/flutter_translate
