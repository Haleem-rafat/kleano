name: thewhsherbiker
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# dont forget to change google infor.plist file
version: 1.0.5+6

environment:
  sdk: ">=2.18.6 <3.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  action_slider: ^0.7.0
  animated_custom_dropdown: ^3.1.1
  cupertino_icons: ^1.0.2
  flutter_flavorizr: ^2.1.5
  flutter_bloc: ^8.1.1
  get_it: ^7.2.0
  flutter_screenutil: ^5.5.4
  flutter_translate: ^4.0.3
  shared_preferences: ^2.0.15
  dartz: ^0.10.1
  dio: ^5.9.0
  equatable: ^2.0.5
  jwt_decoder: ^2.0.1
  flutter_svg: ^1.1.5
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.2
  dotted_border: ^2.0.0+2
  dotted_line: ^3.1.0
  fl_country_code_picker: ^0.1.9+1
  firebase_messaging: ^15.0.3
  flutter_countdown_timer: ^4.1.0
  pin_code_fields: ^8.0.1
  animations: ^2.0.7
  shimmer_animation: ^2.2.2
  # chucker_flutter: ^1.8.3
  cached_network_image: ^3.2.2
  animated_toggle_switch: ^0.8.2
  socket_io_client: ^2.0.1
  image_picker: ^1.1.2
  pull_to_refresh: ^2.0.0
  expandable: ^5.0.1
  url_launcher: ^6.3.1
  audioplayers: ^6.0.0
  google_maps_flutter: ^2.2.1
  geolocator: ^12.0.0
  # flutter_google_places: ^0.3.0
  geocoding: ^3.0.0
  custom_marker: ^1.0.0
  sliding_up_panel: ^2.0.0+1
  lottie: ^3.0.0
  # google_map_polyline_new: ^0.3.0+2
  flutter_local_notifications: ^17.2.1+1
  flutter_rating_bar: ^4.0.1
  swipeable_button_flutter:
  flutter_swipe_button: ^2.1.1+1
  gradient_slide_to_act: ^0.0.2
  photo_view: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
flavorizr:
  app:
    android:
      flavorDimensions: "flavor-type"
    ios:

  flavors:
    pro:
      app:
        name: "Kleano Biker"

      android:
        applicationId: "co.spiritude.thewasherbiker"

      ios:
        bundleId: "co.spiritude.thewasherbiker"

    dev:
      app:
        name: "Kleano Biker Dev"

      android:
        applicationId: "co.spiritude.thewasherbiker.dev"
      ios:
        bundleId: "co.spiritude.thewasherbiker.dev"

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/i18n/
    - assets/images/
    - assets/svg/
    - assets/audio/
    - assets/empty.json
    - assets/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets\fonts\Roboto-Regular.ttf
        - asset: assets\fonts\Roboto-Bold.ttf
    - family: ScriptMT
      fonts:
        - asset: assets\fonts\ScriptMTBold.ttf
    - family: Cairo
      fonts:
        - asset: assets\fonts\Cairo-VariableFont_slnt,wght.ttf
