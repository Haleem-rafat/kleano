plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

apply plugin: 'com.google.gms.google-services'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "co.spiritude.thewhsherbiker"

    signingConfigs {
        release {
            // If key.properties exists, load real keystore settings.
            if (keystorePropertiesFile.exists()) {
                def storeFilePath = keystoreProperties['storeFile']
                if (storeFilePath != null && storeFilePath.toString().trim().length() > 0) {
                    storeFile file(storeFilePath)
                }
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            } else {
                // No keystore provided — we will assign the debug signingConfig
                // in buildTypes.release below to allow building for testers.
            }
        }
    }

    // ----- BEGIN flavorDimensions (autogenerated by flutter_flavorizr) -----
    flavorDimensions "flavor-type"

    productFlavors {
        pro {
            dimension "flavor-type"
            applicationId "co.KleanoBiker"
            resValue "string", "app_name", "KleanO Biker"
        }
        dev {
            dimension "flavor-type"
            applicationId "co.KLeanoBiker.dev"
            resValue "string", "app_name", "KleanO Biker Dev"
            resValue "string", "google_maps_api_key", "AIzaSyBMQiXvjgbjEKXY5PgP9xhoVxDLxeYjYlw"
        }
    }

    // ----- END flavorDimensions (autogenerated by flutter_flavorizr) -----
    compileSdkVersion 35
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "co.spiritude.thewhsherbiker"
        minSdkVersion 23
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // If real keystore exists, use it. Otherwise fall back to debug signing (for testers).
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                // NOTE: Using the debug key for a release build is ONLY for internal testing.
                // APKs signed with the debug key are not suitable for Play Store uploads.
                signingConfig signingConfigs.debug
            }

            // You can keep proguard/minify options here if needed:
            // minifyEnabled false
            // proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation platform('com.google.firebase:firebase-bom:31.1.1')
    implementation 'com.google.firebase:firebase-analytics-ktx'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
