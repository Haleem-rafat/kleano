<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kleano | Your car, washed where it is parked</title>
<meta name="description" content="Book a car wash from your phone. A Kleano biker comes to your car, wherever it is parked.">
<link rel="icon" href="img/logo.png">
<style>
:root{--brand:#543063;--tint:#ECE6EF;--on-tint:#3F2350;--bg:#F6F6F7;--surface:#fff;--text:#1B1B1D;--muted:#5C5C62;--line:#DCDCDF;--font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif}
@media (prefers-color-scheme:dark){:root{--brand:#C9A4DE;--tint:#33283A;--on-tint:#E6D6F0;--bg:#000;--surface:#1C1C1E;--text:#fff;--muted:#A5A5AB;--line:#38383A}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.6 var(--font)}
img{display:block;max-width:100%}a{color:inherit}
.wrap{max-width:1120px;margin:auto;padding-inline:max(16px,4vw)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
.bar img{height:44px;border-radius:10px}
nav{display:flex;align-items:center;gap:20px}
nav a{text-decoration:none;color:var(--muted);font-size:15px}nav a:hover{color:var(--text)}
button{font:inherit;cursor:pointer}
.lang{background:none;border:1px solid var(--line);border-radius:99px;color:var(--text);padding:6px 14px;font-size:14px}
.hero{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:48px;padding-block:64px}
h1{font-size:clamp(38px,6vw,64px);line-height:1.06;letter-spacing:-.02em;margin:0 0 20px;text-wrap:balance}
.lead{font-size:clamp(18px,2vw,21px);color:var(--muted);margin:0 0 28px;max-width:32em}
.cta{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;font-weight:600;padding:14px 28px;border-radius:99px}
@media (prefers-color-scheme:dark){.cta{color:#1C1C1E}}
.hero img{width:100%;height:min(72vh,620px);object-fit:cover;border-radius:28px}
section{padding-block:56px;scroll-margin-top:68px}h2{font-size:clamp(28px,4vw,40px);line-height:1.15;margin:0 0 32px;letter-spacing:-.01em}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:32px;counter-reset:s}
.steps li{counter-increment:s;border-top:2px solid var(--brand);padding-top:16px}
.steps li::before{content:counter(s);font-weight:700;color:var(--brand);font-size:15px}
h3{font-size:20px;margin:6px 0}.steps p,.why p{margin:0;color:var(--muted)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.split img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:28px}
.why{display:grid;gap:24px}
.close{background:var(--tint);color:var(--on-tint);border-radius:28px;padding:48px;text-align:center}
.close h2{margin-bottom:12px}.close p{margin:0 0 24px}
footer{padding-block:32px;color:var(--muted);font-size:14px;text-align:center}
@media (max-width:760px){.hero,.split{grid-template-columns:1fr;gap:28px}.hero{padding-block:36px}.steps{grid-template-columns:1fr}nav a{display:none}.close{padding:32px 20px}.hero img{height:auto;aspect-ratio:4/3}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <a href="#top" aria-label="Kleano"><img src="img/logo.png" alt="Kleano"></a>
  <nav><a href="#how" data-t="navHow"></a><a href="#why" data-t="navWhy"></a><button class="lang" id="lang" type="button"></button></nav>
</div></header>
<main id="top">
  <div class="wrap hero">
    <div><h1 data-t="h1"></h1><p class="lead" data-t="lead"></p><a class="cta" href="#get" data-t="cta"></a></div>
    <img src="img/photo3.jpg" alt="" width="1200" height="1500">
  </div>
  <section id="how"><div class="wrap">
    <h2 data-t="howTitle"></h2>
    <ol class="steps">
      <li><h3 data-t="s1"></h3><p data-t="s1b"></p></li>
      <li><h3 data-t="s2"></h3><p data-t="s2b"></p></li>
      <li><h3 data-t="s3"></h3><p data-t="s3b"></p></li>
    </ol>
  </div></section>
  <section id="why"><div class="wrap split">
    <img src="img/photo1.jpg" alt="" loading="lazy" width="1200" height="800">
    <div><h2 data-t="whyTitle"></h2><div class="why">
      <div><h3 data-t="w1"></h3><p data-t="w1b"></p></div>
      <div><h3 data-t="w2"></h3><p data-t="w2b"></p></div>
      <div><h3 data-t="w3"></h3><p data-t="w3b"></p></div>
    </div></div>
  </div></section>
  <section id="get"><div class="wrap"><div class="close">
    <h2 data-t="getTitle"></h2><p data-t="getBody"></p>
  </div></div></section>
</main>
<footer class="wrap"><span data-t="foot"></span></footer>
<script>
const T={en:{navHow:"How it works",navWhy:"Why Kleano",h1:"Your car, washed where it is parked.",lead:"Choose a wash, pick a time and share your location. A Kleano biker comes to your car.",cta:"Get the app",howTitle:"Three steps to a clean car",s1:"Choose your wash",s1b:"Outside, inside, or add the extras you want. You see the total before you book.",s2:"Pick a time and place",s2b:"Select your car, a time that suits you, and the address where it is parked.",s3:"Follow your biker",s3b:"Track each stage, from on the way to finished, and see before and after photos.",whyTitle:"Made to fit your day",w1:"We come to you",w1b:"Home or work, your saved places are one tap away.",w2:"Pay your way",w2b:"Wallet, card or Apple Pay.",w3:"Wash more, pay less",w3b:"Monthly plans for regular washes.",getTitle:"Get Kleano on your phone",getBody:"Available for iPhone and Android.",foot:"Kleano",lang:"العربية"},
ar:{navHow:"كيف يعمل",navWhy:"لماذا كلينو",h1:"سيارتك تُغسل في مكان وقوفها.",lead:"اختر الغسلة وحدد الوقت وشارك موقعك، وسيأتي إليك سائق كلينو.",cta:"حمّل التطبيق",howTitle:"ثلاث خطوات لسيارة نظيفة",s1:"اختر الغسلة",s1b:"خارجية أو داخلية، مع الإضافات التي تريدها. ترى الإجمالي قبل الحجز.",s2:"حدد الوقت والمكان",s2b:"اختر سيارتك والوقت المناسب والعنوان الذي تقف فيه.",s3:"تابع السائق",s3b:"تابع كل مرحلة من الطريق حتى الانتهاء، وشاهد صور قبل وبعد الغسيل.",whyTitle:"مصمم ليناسب يومك",w1:"نأتي إليك",w1b:"المنزل أو العمل، أماكنك المحفوظة على بعد لمسة.",w2:"ادفع بطريقتك",w2b:"المحفظة أو البطاقة أو Apple Pay.",w3:"اغسل أكثر وادفع أقل",w3b:"باقات شهرية للغسيل المنتظم.",getTitle:"حمّل كلينو على هاتفك",getBody:"متاح على iPhone وAndroid.",foot:"كلينو",lang:"English"}};
function set(l){document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";document.querySelectorAll("[data-t]").forEach(e=>e.textContent=T[l][e.dataset.t]);document.getElementById("lang").textContent=T[l].lang;document.getElementById("lang").onclick=()=>set(l==="ar"?"en":"ar");try{localStorage.setItem("lang",l)}catch(e){}}
let saved=null;try{saved=localStorage.getItem("lang")}catch(e){}
set(saved||(navigator.language.startsWith("ar")?"ar":"en"));
</script>
</body>
</html>
